[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balanza-privada"
version = "0.1.0"
description = "Utilidad local y estricta para anonimizar balanzas de comprobacion digitales."
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<1.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

