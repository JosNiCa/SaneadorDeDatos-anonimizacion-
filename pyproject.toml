[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balanza-privada"
version = "0.1.0"
description = "Utilidad local y estricta para anonimizar balanzas de comprobacion digitales."
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<1.27",
    "openpyxl>=3.1,<3.2",
    "Pillow>=10.3,<13",
    "lxml>=5.2,<7",
    "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "private_integration: pruebas opcionales con muestras sanitizadas externas al repositorio",
]
